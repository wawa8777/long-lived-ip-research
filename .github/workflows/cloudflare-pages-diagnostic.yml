name: Diagnose and deploy Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - '.github/workflows/cloudflare-pages-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-project:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT1: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_ALT2: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_ALT3: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_ACCOUNT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ALT1: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCOUNT_ALT2: ${{ secrets.CF_ACCOUNT }}
      CF_PROJECT_NAME: long-lived-ip-research
    steps:
      - uses: actions/checkout@v4
      - name: Check whether Cloudflare deployment credentials are configured
        run: |
          CF_TOKEN="${CF_TOKEN_PRIMARY:-${CF_TOKEN_ALT1:-${CF_TOKEN_ALT2:-${CF_TOKEN_ALT3:-}}}}"
          CF_ACCOUNT_ID="${CF_ACCOUNT_PRIMARY:-${CF_ACCOUNT_ALT1:-${CF_ACCOUNT_ALT2:-}}}"
          if [ -n "$CF_TOKEN" ]; then echo "CLOUDFLARE_TOKEN_CREDENTIAL=present"; else echo "CLOUDFLARE_TOKEN_CREDENTIAL=missing"; fi
          if [ -n "$CF_ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_CREDENTIAL=present"; else echo "CLOUDFLARE_ACCOUNT_CREDENTIAL=missing"; fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "DIRECT_API_DEPLOY_UNAVAILABLE=true"
            echo "Cloudflare API diagnostics require a token and account ID configured as repository Actions secrets."
            exit 0
          fi
          echo "CF_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT_ID=$CF_ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Inspect exact Pages project connection and build settings
        if: ${{ env.CF_TOKEN_PRIMARY != '' || env.CF_TOKEN_ALT1 != '' || env.CF_TOKEN_ALT2 != '' || env.CF_TOKEN_ALT3 != '' }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}"
          CODE=$(curl -sS --max-time 25 -o /tmp/cf-project.json -w '%{http_code}' "$API" -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
          echo "CLOUDFLARE_PROJECT_API_HTTP=$CODE"
          python - <<'PY'
          import json,sys
          p=json.load(open('/tmp/cf-project.json',encoding='utf-8'))
          print('CLOUDFLARE_API_SUCCESS=',p.get('success'))
          if not p.get('success'):
            print('CLOUDFLARE_API_ERRORS=',json.dumps(p.get('errors',[]),ensure_ascii=False))
            sys.exit(0)
          r=p.get('result') or {}
          s=r.get('source') or {}
          b=r.get('build_config') or {}
          print('PROJECT_NAME=',r.get('name'))
          print('PRODUCTION_BRANCH=',r.get('production_branch'))
          print('SOURCE_TYPE=',s.get('type'))
          print('SOURCE_OWNER=',(s.get('config') or {}).get('owner'))
          print('SOURCE_REPO=',(s.get('config') or {}).get('repo_name'))
          print('ROOT_DIR=',b.get('root_dir'))
          print('BUILD_COMMAND=',repr(b.get('build_command')))
          print('DESTINATION_DIR=',repr(b.get('destination_dir')))
          print('LATEST_PRODUCTION_DEPLOYMENT=',json.dumps(r.get('latest_deployment') or {},ensure_ascii=False)[:1800])
          PY
          python - <<'PY'
          import json,sys
          p=json.load(open('/tmp/cf-project.json',encoding='utf-8'))
          if not p.get('success') or not p.get('result'):
            sys.exit(0)
          r=p['result']
          source=r.get('source') or {}
          if source.get('type') in ('github','gitlab'):
            print('DEPLOY_MODE=GIT_INTEGRATION')
            print('No direct upload attempted; this project is attached to Git and the returned root/output settings must be corrected first if needed.')
            sys.exit(0)
          print('DEPLOY_MODE=DIRECT_UPLOAD')
          PY
      - name: Deploy project files directly when this Pages project uses Direct Upload
        if: ${{ env.CF_TOKEN_PRIMARY != '' || env.CF_TOKEN_ALT1 != '' || env.CF_TOKEN_ALT2 != '' || env.CF_TOKEN_ALT3 != '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('/tmp/cf-project.json',encoding='utf-8'))
          r=p.get('result') or {}
          source=r.get('source') or {}
          direct = bool(p.get('success') and r and source.get('type') not in ('github','gitlab'))
          open('/tmp/is-direct-upload','w').write('yes' if direct else 'no')
          PY
          if [ "$(cat /tmp/is-direct-upload)" != "yes" ]; then
            echo "Skipping direct upload to avoid pushing to a Git-integrated project."
            exit 0
          fi
          mkdir -p /tmp/pages-output/assets/images
          cp index.html /tmp/pages-output/index.html
          cp assets/images/* /tmp/pages-output/assets/images/
          npx --yes wrangler@4 pages deploy /tmp/pages-output --project-name "$CF_PROJECT_NAME" --branch main
