name: Verify deployed research website and images
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - '.github/workflows/verify-rendered-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-render-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Confirm every real image is visibly rendered on desktop and mobile
        run: |
          mkdir -p artifacts
          cat > verify-report.cjs <<'JS'
          const { chromium } = require('playwright');
          const REPORT_URL = 'https://htmlpreview.github.io/?https://github.com/wawa8777/long-lived-ip-research/blob/main/index.html';

          async function findReportFrame(page) {
            for (const frame of page.frames()) {
              const text = await frame.locator('body').innerText().catch(() => '');
              if (text.includes('長青 IP') && text.includes('成功機制') && text.includes('蠟筆小新')) return frame;
            }
            return null;
          }

          async function verifyViewport(browser, width, height, screenshotPath, label) {
            const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            const response = await page.goto(REPORT_URL,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(1200);
            const reportFrame = await findReportFrame(page);
            if (!reportFrame) {
              console.log(label+'_REPORT_NOT_FOUND', 'title='+await page.title(), 'url='+page.url());
              await page.screenshot({path:'artifacts/'+label.toLowerCase()+'-failed.png',fullPage:true}).catch(()=>{});
              throw new Error(label+': expected report text is not present in rendered browser page.');
            }

            const reportText = await reportFrame.locator('body').innerText();
            const sourceLabels = reportText.split('原始圖片網址').length-1;
            const imgs = reportFrame.locator('img');
            const count = await imgs.count();
            const results = [];
            for (let i=0;i<count;i++) {
              const img=imgs.nth(i);
              await img.evaluate(el=>el.scrollIntoView({block:'center'}));
              await img.evaluate(el=>new Promise(resolve=>{
                const finish=()=>resolve();
                if(el.complete) finish();
                else {
                  el.addEventListener('load',finish,{once:true});
                  el.addEventListener('error',finish,{once:true});
                  setTimeout(finish,15000);
                }
              }));
              const data=await img.evaluate(el=>{
                const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                return {
                  alt:el.alt,src:el.getAttribute('src'),currentSrc:el.currentSrc,
                  loaded:el.complete&&el.naturalWidth>0&&el.naturalHeight>0,
                  naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,
                  visibleWidth:Math.round(r.width),visibleHeight:Math.round(r.height),
                  visible:r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'
                };
              });
              results.push(data);
              console.log(label+'_IMAGE',JSON.stringify(data));
            }
            const overflow = await page.evaluate(()=>({
              viewportWidth:window.innerWidth,
              documentWidth:document.documentElement.scrollWidth,
              horizontalOverflow:document.documentElement.scrollWidth>window.innerWidth+2
            }));
            await page.evaluate(()=>window.scrollTo(0,0)).catch(()=>{});
            await page.screenshot({path:screenshotPath,fullPage:true}).catch(async()=>{
              await reportFrame.locator('body').screenshot({path:screenshotPath});
            });
            const bad=results.filter(x=>!x.loaded||!x.visible||x.visibleWidth<40||x.visibleHeight<40);
            console.log(label+'_SUMMARY',JSON.stringify({
              status:response?.status(),title:await page.title(),imageCount:count,
              visibleSourceLinkLabels:sourceLabels,overflow,failedImages:bad.length
            }));
            await page.close();
            if(response?.status()!==200||count!==7||sourceLabels<7||bad.length>0||
              (label==='MOBILE'&&overflow.horizontalOverflow)) {
              throw new Error(label+': visual check failed '+JSON.stringify({status:response?.status(),count,sourceLabels,bad,overflow}));
            }
            return results;
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const desktop=await verifyViewport(browser,1440,1000,'artifacts/research-report-desktop.png','DESKTOP');
            const mobile=await verifyViewport(browser,390,844,'artifacts/research-report-mobile.png','MOBILE');
            await browser.close();
            console.log('VISUAL_CHECK_PASSED: all 7 real images loaded and visible; all 7 source links are present; desktop and mobile checked.');
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node verify-report.cjs
      - name: Upload verified browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-research-report-desktop-mobile
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
