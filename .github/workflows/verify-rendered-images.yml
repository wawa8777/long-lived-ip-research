name: Verify rendered research images
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - '.github/workflows/verify-rendered-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-render-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Open public report and verify real images render in browser
        run: |
          mkdir -p artifacts
          cat > verify-rendered-images.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            page.on('requestfailed', request => console.log('REQUEST_FAILED', request.url(), request.failure()?.errorText));
            page.on('response', response => {
              if (response.url().includes('/assets/images/')) console.log('IMAGE_RESPONSE', response.status(), response.headers()['content-type'], response.url());
            });
            const url = 'https://raw.githack.com/wawa8777/long-lived-ip-research/main/index.html?visual-check=' + Date.now();
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            console.log('PAGE_HTTP_STATUS', response && response.status());
            await page.waitForLoadState('networkidle', { timeout: 45000 }).catch(() => console.log('NETWORKIDLE_TIMEOUT'));
            const images = page.locator('img');
            const count = await images.count();
            console.log('IMG_TAG_COUNT', count);
            const results = [];
            for (let i = 0; i < count; i++) {
              const img = images.nth(i);
              await img.scrollIntoViewIfNeeded();
              const data = await img.evaluate(el => new Promise(resolve => {
                const report = () => {
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  resolve({
                    alt: el.alt, src: el.getAttribute('src'), currentSrc: el.currentSrc,
                    complete: el.complete, naturalWidth: el.naturalWidth, naturalHeight: el.naturalHeight,
                    visibleWidth: Math.round(rect.width), visibleHeight: Math.round(rect.height),
                    display: style.display, visibility: style.visibility,
                    visible: rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden'
                  });
                };
                if (el.complete) report();
                else {
                  el.addEventListener('load', report, { once: true });
                  el.addEventListener('error', report, { once: true });
                  setTimeout(report, 15000);
                }
              }));
              results.push(data);
              console.log('IMAGE_RENDER_RESULT', JSON.stringify(data));
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: 'artifacts/research-report-desktop.png', fullPage: true });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'networkidle', timeout: 90000 }).catch(() => {});
            const mobileCount = await page.locator('img').count();
            const mobile = [];
            for (let i = 0; i < mobileCount; i++) {
              const img = page.locator('img').nth(i);
              await img.scrollIntoViewIfNeeded();
              mobile.push(await img.evaluate(el => ({
                src: el.getAttribute('src'), loaded: el.complete && el.naturalWidth > 0,
                naturalWidth: el.naturalWidth, naturalHeight: el.naturalHeight,
                width: Math.round(el.getBoundingClientRect().width),
                height: Math.round(el.getBoundingClientRect().height)
              })));
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: 'artifacts/research-report-mobile.png', fullPage: true });
            console.log('MOBILE_RENDER_RESULTS', JSON.stringify(mobile));
            await browser.close();
            const bad = results.filter(x => !x.complete || x.naturalWidth <= 0 || x.naturalHeight <= 0 || !x.visible);
            const badMobile = mobile.filter(x => !x.loaded || x.width <= 0 || x.height <= 0);
            if (response?.status() !== 200 || count !== 7 || bad.length || mobileCount !== 7 || badMobile.length) {
              console.error('VISUAL_CHECK_FAILED', JSON.stringify({ status: response?.status(), count, bad, mobileCount, badMobile }));
              process.exit(1);
            }
            console.log('VISUAL_CHECK_PASSED: all 7 actual images rendered and visible on desktop and mobile');
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node verify-rendered-images.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-research-report-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
