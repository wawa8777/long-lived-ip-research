name: Verify rendered research images
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - '.github/workflows/verify-rendered-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-render-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Inspect actual rendered page and confirm all real case images
        run: |
          mkdir -p artifacts
          cat > verify-rendered-images.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            page.on('requestfailed', request => console.log('REQUEST_FAILED', request.url(), request.failure()?.errorText));
            page.on('response', response => {
              if (response.url().includes('/assets/images/')) console.log('IMAGE_RESPONSE', response.status(), response.headers()['content-type'], response.url());
            });
            const url = 'https://raw.githack.com/wawa8777/long-lived-ip-research/main/index.html?visual-check=' + Date.now();
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            console.log('PAGE_HTTP_STATUS', response && response.status(), 'FINAL_URL', page.url());
            await page.waitForTimeout(5000);
            console.log('PAGE_TITLE', await page.title());
            console.log('PAGE_BODY_TEXT', (await page.locator('body').innerText().catch(() => '')).slice(0, 1800));
            const frames = page.frames();
            console.log('FRAME_COUNT', frames.length);
            let reportFrame = null;
            const frameReports = [];
            for (const frame of frames) {
              let url = frame.url();
              let title = '', bodyText = '', count = 0, paths = [];
              try {
                title = await frame.title().catch(() => '');
                bodyText = await frame.locator('body').innerText({ timeout: 5000 }).catch(() => '');
                count = await frame.locator('img').count().catch(() => 0);
                paths = await frame.locator('img').evaluateAll(els => els.map(e => e.getAttribute('src'))).catch(() => []);
              } catch(e) {}
              console.log('FRAME_DIAGNOSTIC', JSON.stringify({url,title,text:bodyText.slice(0,500),imgCount:count,paths}));
              frameReports.push({frame,url,title,bodyText,count,paths});
              if (bodyText.includes('長青 IP 研究室') && bodyText.includes('成功機制') && bodyText.includes('蠟筆小新')) reportFrame = frame;
            }
            if (!reportFrame) {
              await page.screenshot({ path: 'artifacts/failed-top-level.png', fullPage: true }).catch(() => {});
              throw new Error('The actual report content was not found in any rendered frame. This URL is not passing the real browser rendering test.');
            }
            const images = reportFrame.locator('img');
            const count = await images.count();
            console.log('REPORT_IMG_TAG_COUNT', count);
            const results = [];
            for (let i = 0; i < count; i++) {
              const img = images.nth(i);
              await img.evaluate(el => el.scrollIntoView({block:'center'}));
              await img.evaluate(el => new Promise(resolve => {
                const report = () => resolve({
                  alt: el.alt, src: el.getAttribute('src'), currentSrc: el.currentSrc,
                  complete: el.complete, naturalWidth: el.naturalWidth, naturalHeight: el.naturalHeight,
                  visibleWidth: Math.round(el.getBoundingClientRect().width), visibleHeight: Math.round(el.getBoundingClientRect().height),
                  display: getComputedStyle(el).display, visibility: getComputedStyle(el).visibility,
                  visible: el.getBoundingClientRect().width > 0 && el.getBoundingClientRect().height > 0 && getComputedStyle(el).display !== 'none' && getComputedStyle(el).visibility !== 'hidden'
                });
                if (el.complete && (el.naturalWidth > 0 || el.naturalWidth === 0)) report();
                else {
                  el.addEventListener('load', report, {once:true});
                  el.addEventListener('error', report, {once:true});
                  setTimeout(report, 15000);
                }
              }));
              const data = await img.evaluate(el => ({
                alt: el.alt, src: el.getAttribute('src'), currentSrc: el.currentSrc,
                complete: el.complete, naturalWidth: el.naturalWidth, naturalHeight: el.naturalHeight,
                visibleWidth: Math.round(el.getBoundingClientRect().width), visibleHeight: Math.round(el.getBoundingClientRect().height),
                display: getComputedStyle(el).display, visibility: getComputedStyle(el).visibility,
                visible: el.getBoundingClientRect().width > 0 && el.getBoundingClientRect().height > 0 && getComputedStyle(el).display !== 'none' && getComputedStyle(el).visibility !== 'hidden'
              }));
              results.push(data);
              console.log('IMAGE_RENDER_RESULT', JSON.stringify(data));
            }
            await page.evaluate(() => window.scrollTo(0, 0)).catch(() => {});
            await page.screenshot({ path: 'artifacts/research-report-desktop.png', fullPage: true }).catch(async () =>
              await reportFrame.locator('body').screenshot({path:'artifacts/research-report-desktop.png'}));
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto(url, {waitUntil:'domcontentloaded',timeout:90000});
            await mobile.waitForTimeout(4000);
            let mobileFrame = null;
            for (const frame of mobile.frames()) {
              const txt = await frame.locator('body').innerText().catch(()=> '');
              if (txt.includes('長青 IP 研究室') && txt.includes('成功機制')) { mobileFrame = frame; break; }
            }
            if (!mobileFrame) throw new Error('Mobile browser did not render the actual report.');
            const mobileImages = mobileFrame.locator('img');
            const mobileCount = await mobileImages.count();
            const mobileResults = [];
            for (let i=0;i<mobileCount;i++) {
              const img=mobileImages.nth(i);
              await img.evaluate(el=>el.scrollIntoView({block:'center'}));
              await img.evaluate(el=>new Promise(resolve=>{
                const r=()=>resolve();
                if(el.complete) r(); else {el.addEventListener('load',r,{once:true});el.addEventListener('error',r,{once:true});setTimeout(r,15000);}
              }));
              mobileResults.push(await img.evaluate(el=>({
                src:el.getAttribute('src'),loaded:el.complete&&el.naturalWidth>0,
                naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,
                width:Math.round(el.getBoundingClientRect().width),height:Math.round(el.getBoundingClientRect().height)
              })));
            }
            await mobile.screenshot({path:'artifacts/research-report-mobile.png',fullPage:true}).catch(async()=>
              await mobileFrame.locator('body').screenshot({path:'artifacts/research-report-mobile.png'}));
            console.log('MOBILE_RENDER_RESULTS',JSON.stringify(mobileResults));
            await browser.close();
            const bad=results.filter(x=>!x.complete||x.naturalWidth<=0||x.naturalHeight<=0||!x.visible||x.visibleWidth<40||x.visibleHeight<40);
            const badMobile=mobileResults.filter(x=>!x.loaded||x.width<=0||x.height<=0);
            if(response?.status()!==200||count!==7||bad.length||mobileCount!==7||badMobile.length) {
              console.error('VISUAL_CHECK_FAILED',JSON.stringify({status:response?.status(),count,bad,mobileCount,badMobile}));
              process.exit(1);
            }
            console.log('VISUAL_CHECK_PASSED: all 7 actual images rendered and visible in desktop and mobile browser frames');
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
          node verify-rendered-images.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-research-report-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
