name: Find a browser-rendered public report URL
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - '.github/workflows/verify-live-alternates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-hosting-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test environment
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Test real browser display on independent static hosts
        run: |
          mkdir -p artifacts
          cat > test-live-hosts.cjs <<'JS'
          const {chromium}=require('playwright');
          const targets=[
            ['HTML Preview via GitHub blob','https://htmlpreview.github.io/?https://github.com/wawa8777/long-lived-ip-research/blob/main/index.html'],
            ['HTML Preview via raw URL','https://htmlpreview.github.io/?https://raw.githubusercontent.com/wawa8777/long-lived-ip-research/main/index.html'],
            ['rawcdn.githack','https://rawcdn.githack.com/wawa8777/long-lived-ip-research/main/index.html'],
            ['GitHub Pages default URL','https://wawa8777.github.io/long-lived-ip-research/'],
            ['Statically CDN','https://cdn.statically.io/gh/wawa8777/long-lived-ip-research/main/index.html'],
            ['jsDelivr CDN','https://cdn.jsdelivr.net/gh/wawa8777/long-lived-ip-research@main/index.html'],
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            let successful=null;
            for(let i=0;i<targets.length;i++){
              const [name,base]=targets[i];
              const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              const url=name.startsWith('HTML Preview')||name==='rawcdn.githack'?base:base+(base.includes('?')?'&':'?')+'visual-check='+Date.now();
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(2500);
                console.log('HOST_RESULT',JSON.stringify({name,url,status:response?.status(),finalURL:page.url(),title:await page.title(),body:(await page.locator('body').innerText().catch(()=>'' )).slice(0,300)}));
                let reportFrame=null;
                for(const frame of page.frames()){
                  const text=await frame.locator('body').innerText().catch(()=> '');
                  if(text.includes('長青 IP 研究室')&&text.includes('成功機制')&&text.includes('蠟筆小新')){reportFrame=frame;break;}
                }
                if(!reportFrame){console.log('HOST_NO_REPORT_DOM',name); await page.close();continue;}
                const imgs=reportFrame.locator('img');
                const count=await imgs.count();
                const rendered=[];
                for(let k=0;k<count;k++){
                  const img=imgs.nth(k);
                  await img.evaluate(el=>el.scrollIntoView({block:'center'}));
                  await img.evaluate(el=>new Promise(resolve=>{
                    const finish=()=>resolve();
                    if(el.complete)finish();
                    else {el.addEventListener('load',finish,{once:true});el.addEventListener('error',finish,{once:true});setTimeout(finish,15000);}
                  }));
                  rendered.push(await img.evaluate(el=>({
                    alt:el.alt,src:el.getAttribute('src'),currentSrc:el.currentSrc,
                    loaded:el.complete&&el.naturalWidth>0,naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,
                    visibleWidth:Math.round(el.getBoundingClientRect().width),visibleHeight:Math.round(el.getBoundingClientRect().height),
                    visible:el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0&&getComputedStyle(el).visibility==='visible'&&getComputedStyle(el).display!=='none'
                  })));
                }
                console.log('HOST_IMAGE_RENDER',name,JSON.stringify(rendered));
                const sourceCount=(await reportFrame.locator('body').innerText()).split('原始圖片網址').length-1;
                const valid=response?.status()===200&&count===7&&rendered.every(x=>x.loaded&&x.visibleWidth>=40&&x.visibleHeight>=40&&x.visible)&&sourceCount>=6;
                if(valid){
                  await page.evaluate(()=>window.scrollTo(0,0)).catch(()=>{});
                  await page.screenshot({path:'artifacts/live-report-desktop.png',fullPage:true}).catch(async()=>await reportFrame.locator('body').screenshot({path:'artifacts/live-report-desktop.png'}));
                  await page.setViewportSize({width:390,height:844});
                  await page.screenshot({path:'artifacts/live-report-mobile.png',fullPage:true}).catch(async()=>await reportFrame.locator('body').screenshot({path:'artifacts/live-report-mobile.png'}));
                  successful={name,url,count,sourceCount,images:rendered};
                  console.log('PUBLISH_URL_VISUAL_VERIFIED',JSON.stringify(successful));
                  await page.close();
                  break;
                }
                console.log('HOST_FAILED_VISUAL_CRITERIA',name,JSON.stringify({count,sourceCount,unloaded:rendered.filter(x=>!x.loaded).length}));
              }catch(e){console.log('HOST_ERROR',name,String(e).slice(0,500));}
              await page.close();
            }
            await browser.close();
            if(!successful){console.error('NO_ALTERNATE_HOST_PASSED_BROWSER_VISUAL_TEST');process.exit(1);}
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node test-live-hosts.cjs
      - name: Upload verified website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-live-report-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
