name: Publish static site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/publish-github-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          echo "Prepared HTML bytes: $(wc -c < _site/index.html)"
          echo "Local image assets:"
          find _site/assets/images -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test "$(find _site/assets/images -maxdepth 1 -type f | wc -l)" -ge 7
          test "$(grep -o 'src="assets/images/' _site/index.html | wc -l)" -ge 7
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
