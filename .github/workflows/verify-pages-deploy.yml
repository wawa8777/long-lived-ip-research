name: Verify production Pages images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production response and confirm HTML is live
        run: |
          set -euo pipefail
          SITE="https://long-lived-ip-research.pages.dev"
          EXPECTED='assets/images/one-piece.jpg assets/images/pokemon.png assets/images/hello-kitty.jpg assets/images/snoopy.jpg assets/images/ultraman.png assets/images/simpsons.jpg assets/images/shinchan.png'
          PASS=0
          for attempt in $(seq 1 12); do
            code=$(curl -sSL --max-time 20 -w '%{http_code}' "${SITE}/?verify=${GITHUB_RUN_ID}-${attempt}" -o /tmp/live-index.html || true)
            bytes=$(wc -c < /tmp/live-index.html 2>/dev/null || echo 0)
            title=$(grep -o '<title>[^<]*' /tmp/live-index.html 2>/dev/null | head -1 || true)
            echo "ATTEMPT=$attempt HTTP=$code BYTES=$bytes TITLE=$title"
            ALL_FOUND=1
            MISSING=''
            for item in $EXPECTED; do
              if ! grep -Fq "$item" /tmp/live-index.html 2>/dev/null; then
                ALL_FOUND=0
                MISSING="$MISSING $item"
              fi
            done
            echo "MISSING_ASSET_REFERENCES=$MISSING"
            if [ "$code" = "200" ] && [ "$ALL_FOUND" -eq 1 ] && grep -Fq '部署檢查版｜2026-10-16' /tmp/live-index.html && ! grep -Fq '這一版尚未將圖片二進位檔下載' /tmp/live-index.html; then
              PASS=1
              echo "LIVE_HTML_CONFIRMED attempt=$attempt"
              break
            fi
            sleep 6
          done
          echo "live_html_pass=$PASS" >> "$GITHUB_OUTPUT"
          if [ "$PASS" -ne 1 ]; then
            echo "FINAL_RESPONSE_DIAGNOSTICS:"
            [ ! -f /tmp/live-index.html ] || {
              grep -o '<title>[^<]*' /tmp/live-index.html | head -1 || true
              echo "Image src attributes served by the current production HTML:"
              grep -oE 'src="[^"]+"' /tmp/live-index.html | head -20 || true
              echo "Known image paths found in production HTML:"
              grep -o 'assets/images/[^" ]*' /tmp/live-index.html | sort -u | head -20 || true
              echo "Source link count:"
              grep -o '原始圖片網址' /tmp/live-index.html | wc -l || true
            }
            echo "Production HTML is stale; continuing to test individual asset URLs for diagnosis."
          fi
      - name: Verify all seven public image URLs return image content
        run: |
          set -euo pipefail
          SITE="https://long-lived-ip-research.pages.dev"
          for item in assets/images/one-piece.jpg assets/images/pokemon.png assets/images/hello-kitty.jpg assets/images/snoopy.jpg assets/images/ultraman.png assets/images/simpsons.jpg assets/images/shinchan.png; do
            result=$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}|%{content_type}' "${SITE}/${item}?verify=${GITHUB_RUN_ID}")
            status="${result%%|*}"
            mime="${result#*|}"
            echo "$item => HTTP=$status MIME=$mime"
            [ "$status" = "200" ]
            case "$mime" in image/*) ;; *) echo "Not served as an image: $item"; exit 1;; esac
          done
      - name: Confirm visible source citations exist in deployed HTML
        run: |
          set -euo pipefail
          COUNT=$(grep -o '原始圖片網址' /tmp/live-index.html | wc -l | tr -d ' ')
          echo "Visible original-image source links: $COUNT"
          [ "$COUNT" -ge 6 ]
          grep -Fq 'https://one-piece.com/character/Mugiwarano_itimi/index.html' /tmp/live-index.html
          grep -Fq 'https://www.pokemon.com/us/pokedex/25' /tmp/live-index.html
          grep -Fq 'https://tsuburaya-prod.com/heroes/ultraman' /tmp/live-index.html
          echo "SOURCE_CITATIONS_CONFIRMED"
