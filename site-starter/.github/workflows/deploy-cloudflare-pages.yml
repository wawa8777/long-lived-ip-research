name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required configuration
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_PAGES_DEPLOY_HOOK"
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error::Missing repository variable SITE_URL (for example https://your-project.pages.dev)"
            exit 1
          fi
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::SITE_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Validate starter HTML
        run: |
          test -s index.html
          grep -q '<html' index.html
          grep -q 'name="viewport"' index.html

      - name: Trigger Cloudflare Pages deployment
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          code=$(curl -sS -o /tmp/deploy-response.txt -w '%{http_code}' -X POST "$DEPLOY_HOOK")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Cloudflare deploy hook returned HTTP $code"
            cat /tmp/deploy-response.txt
            exit 1
          fi
          echo "Cloudflare deploy hook accepted the request (HTTP $code)."

      - name: Verify production website responds
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' "$SITE_URL" || true)
            if [ "$code" = "200" ] && grep -qi '<html' /tmp/site.html; then
              echo "Production site returned valid HTML (HTTP 200)."
              exit 0
            fi
            echo "Attempt $attempt: site not ready yet (HTTP ${code:-unknown}); waiting 10 seconds."
            sleep 10
          done
          echo "::error::Production site did not return valid HTML after waiting."
          exit 1
